version: '3.8'

services:
  mysqldb:
    image: mysql:8.0
    container_name: docdrift-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: docdrift
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  docdrift-app:
    build: .
    container_name: docdrift-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/docdrift?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    depends_on:
      - mysqldb

volumes:
  mysql_data:
