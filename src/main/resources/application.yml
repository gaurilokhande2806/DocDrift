server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: DocDrift
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/docdrift?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

docdrift:
  storage:
    upload-dir: ./uploads
  scoring:
    max-weight: 8.0
    weights:
      LOW: 1.0
      MEDIUM: 2.0
      HIGH: 4.0
      CRITICAL: 8.0
